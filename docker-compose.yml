# Local development stack. There is no hosted environment for this project —
# everything runs here.
#
# MongoDB runs as a single-node replica set on purpose: change streams (the CDC
# source feeding Kafka in M2) are unavailable on a standalone server.

services:
  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    # Host port is 27018 by default so this stack can coexist with any other
    # MongoDB already bound to 27017 on the developer's machine.
    ports:
      - '${MONGO_HOST_PORT:-27018}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once a
      # PRIMARY has been elected.
      test: |
        mongosh --quiet --eval '
          try { rs.status().ok } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}).ok
          }
        '
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Single-broker Kafka in KRaft mode — no Zookeeper (D19).
  #
  # Two listeners on purpose: INTERNAL is what Connect and the consumer use from
  # inside the network, EXTERNAL is what host tools use. A single listener cannot
  # advertise an address that resolves both places.
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    ports:
      - '${KAFKA_HOST_PORT:-9094}:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # A KRaft cluster id must be a URL-safe base64 UUID, not an arbitrary
      # string. Fixed here so restarts reuse the same log directory.
      CLUSTER_ID: MkU3OEVCNTcwNTFENDNCNA
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker: everything that defaults to 3 replicas must come down to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Kafka Connect carrying the Debezium MongoDB connector. This is the CDC relay
  # (D11): it tails the oplog and publishes, so the application never dual-writes.
  kafka-connect:
    image: quay.io/debezium/connect:3.0
    ports:
      - '${KAFKA_CONNECT_HOST_PORT:-8083}:8083'
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: messaging-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Values carry no schema envelope — the consumer reads plain JSON.
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8083/connectors >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Single-node Elasticsearch for the message search index.
  #
  # Security off and a small heap on purpose: this is a local development
  # dependency, not a cluster. The multi-tenant index layout is ADR-003.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    ports:
      - '${ELASTICSEARCH_HOST_PORT:-9200}:9200'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
      # A one-node cluster can never allocate replicas, so leave shard
      # allocation alone rather than letting the watermark turn it read-only.
      cluster.routing.allocation.disk.threshold_enabled: 'false'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9200/_cluster/health | grep -q ''"status":"\(green\|yellow\)"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Applies index migrations, then exits. Run it before the api the first time:
  #   docker compose up migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    # Not `pnpm migrate:up`: the production stage installs runtime dependencies
    # only and has no pnpm, so the script name resolves to nothing. The binary is
    # present because migrate-mongo is a runtime dependency — and it is invoked
    # directly rather than through `node`, since .bin entries are shell wrappers.
    command: ['node_modules/.bin/migrate-mongo', 'up']
    environment:
      MONGO_URI: mongodb://mongo:27017/messaging?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - migrate

  # One image, one command each — see ADR-001. Identity joins as another service
  # here, not as another Dockerfile.
  messaging-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/messaging/main']
    ports:
      - '${PORT:-3000}:3000'
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      MONGO_URI: mongodb://mongo:27017/messaging?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-character-secret-value}
      # The API reads the search index too — MessageRepository is the one door to
      # messages whichever store answers, so it builds an Elasticsearch client.
      ELASTICSEARCH_NODE: http://elasticsearch:9200
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    profiles:
      - app
    restart: unless-stopped

  # Tenants and users, and the tokens that carry them. Same image again — see
  # ADR-007 for why this is a second context rather than a second repository.
  identity-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/identity/main']
    ports:
      - '${IDENTITY_PORT:-3001}:3001'
    environment:
      APP_ENV: ${APP_ENV:-local}
      IDENTITY_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      MONGO_URI: mongodb://mongo:27017/messaging?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The same secret messaging verifies with. One deployable, one key — the
      # moment these are separate services this becomes a key distribution
      # problem, and that is the point at which asymmetric signing earns its keep.
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-character-secret-value}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app
    restart: unless-stopped

  # The indexer. Same image as the API, different command — it consumes the CDC
  # topic and writes to Elasticsearch, and is scaled by consumer lag rather than
  # by request rate.
  messaging-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/messaging/main.consumer']
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      MONGO_URI: mongodb://mongo:27017/messaging?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-character-secret-value}
      # The in-compose listener, not the 9094 the host uses.
      KAFKA_BROKERS: kafka:9092
      ELASTICSEARCH_NODE: http://elasticsearch:9200
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    profiles:
      - app
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  elasticsearch_data:
  # Without this, `docker compose down` takes every topic and every committed
  # offset with it, and the consumer then dies on a topic that no longer exists.
  kafka_data:
