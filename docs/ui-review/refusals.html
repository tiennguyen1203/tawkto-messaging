      <h1>What the API refuses</h1>
      <p class="lede">The two callers messaging must turn away, and why each gets a different answer. This page is the reason a real authorisation hole was found and fixed.</p>

      <div class="shots">
        <figure>

          <figcaption><strong>Refused twice, for two different reasons</strong><span>Each button mints a real second identity and asks for this same conversation. Another tenant gets <strong>404</strong> — even its existence belongs to its owner. A colleague in the tenant who is not a participant gets <strong>403</strong>. <strong>This panel found a real hole:</strong> both read paths checked the tenant and stopped there, so any token for a tenant could read any conversation in it by id. Fixed, and held by three tests.</span></figcaption>
