# The demo client's own container: static files, plus the same two proxy prefixes
# `vite.config.ts` serves in development.
#
# Proxying rather than calling the services directly is what keeps the browser on
# one origin, so neither API needs a CORS policy — see PLAN §10b. It also means the
# client's code is identical in development and in the image: `/identity-api/...`
# and `/api/...` mean the same thing in both, and a base URL never has to be
# injected at build time.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, consulted per request rather than once at startup.
    # nginx resolves a hostname written literally in proxy_pass exactly once, when
    # the worker starts: recreate identity-api and its address changes while nginx
    # keeps sending traffic to an address nothing answers on, until someone
    # notices and reloads it. Assigning the upstream to a variable defers the
    # lookup to request time.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Identity carries a prefix of its own rather than being routed by path: both
    # services answer on `/api/health`, so the path alone cannot say which is
    # meant. It is stripped here, exactly as Vite's `rewrite` strips it.
    location /identity-api/ {
        set $identity_upstream http://identity-api:3001;
        rewrite ^/identity-api/(.*)$ /$1 break;
        proxy_pass $identity_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $messaging_upstream http://messaging-api:3000;
        proxy_pass $messaging_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these, so the name changes whenever the content does and
    # they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Anything else is the single-page app's own routing and must reach
    # index.html rather than a 404. index.html itself is never cached: it names
    # the fingerprinted bundles, so a stale copy points at assets that no longer
    # exist and the page comes up blank.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
